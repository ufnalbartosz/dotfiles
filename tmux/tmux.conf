# --- Emacs keys ---
# Copy mode (Ctrl-b [) and the ":" command prompt use Emacs bindings.
set -g mode-keys emacs
set -g status-keys emacs

# Keep the default prefix (C-b). C-a is left free for "beginning of line"
# in the shell and in vim/emacs.
set -g prefix C-b
bind C-b send-prefix

# --- Basics ---
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 10
set -g focus-events on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# --- Splits keep the current directory, and are easier to remember ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Emacs-style pane movement: C-b then C-p/C-n/C-b/C-f ---
bind -r C-p select-pane -U
bind -r C-n select-pane -D
bind -r C-b select-pane -L
bind -r C-f select-pane -R

# --- Copy mode: C-Space to start selection, M-w to copy (Emacs style) ---
# In copy mode (C-b [): C-Space = set mark, M-w = copy, C-s / C-r = search.
bind -T copy-mode C-Space send -X begin-selection
bind -T copy-mode M-w send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode C-w send -X copy-pipe-and-cancel "pbcopy"

# --- Reload config: C-b r ---
bind r source-file ~/.tmux.conf \; display-message "Reloaded ~/.tmux.conf"
